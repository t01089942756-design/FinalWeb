<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinalWeb - 방명록</title>
  <style>
    body {
      font-family: 'Malgun Gothic', sans-serif;
      margin: 20px;
      line-height: 1.6;
    }

    /* 상단 링크 스타일 */
    .top-link {
      font-size: 18px;
      color: #551A8B;
      text-decoration: underline;
      cursor: pointer;
    }

    /* 방명록 영역 (초기 숨김 처리) */
    #guestbook-section {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-width: 800px;
      background-color: #ffffff;
    }

    #guestbook-section h2 {
      margin-top: 0;
      font-size: 20px;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <hr>
  <!-- 방명록 열기/닫기 링크 -->
  <a href="#guestbook-section" id="toggle-guestbook" class="top-link">이슈 게시판 이용 방명록 이동</a>

  <!-- 같은 페이지에 나타날 Giscus 방명록 영역 -->
  <section id="guestbook-section">
    <h2>방명록</h2>
    <!-- Giscus 위젯이 삽입될 컨테이너 -->
    <div id="giscus-container"></div>
  </section>

  <script>
    const toggleLink = document.getElementById('toggle-guestbook');
    const guestbookSection = document.getElementById('guestbook-section');
    const giscusContainer = document.getElementById('giscus-container');
    let isGiscusLoaded = false;

    toggleLink.addEventListener('click', function(event) {
      event.preventDefault(); // 페이지 이동 방지

      if (guestbookSection.style.display === 'none' || guestbookSection.style.display === '') {
        guestbookSection.style.display = 'block';

        // 처음 열 때만 Giscus 스크립트를 생성하여 삽입
        if (!isGiscusLoaded) {
          loadGiscus();
          isGiscusLoaded = true;
        }
      } else {
        guestbookSection.style.display = 'none';
      }
    });

    function loadGiscus() {
      const script = document.createElement('script');
      script.src = 'https://giscus.app/client.js';
      script.setAttribute('data-repo', 't01089942756-design/FinalWeb');
      script.setAttribute('data-repo-id', 'R_kgDOVvx7zg');
      script.setAttribute('data-category', 'General');
      script.setAttribute('data-category-id', 'DIC_kwDOVvx7zs4DLOYD');
      script.setAttribute('data-mapping', 'pathname');
      script.setAttribute('data-strict', '0');
      script.setAttribute('data-reactions-enabled', '1');
      script.setAttribute('data-emit-metadata', '0');
      script.setAttribute('data-input-position', 'bottom');
      script.setAttribute('data-theme', 'preferred_color_scheme');
      script.setAttribute('data-lang', 'ko');
      script.setAttribute('crossorigin', 'anonymous');
      script.async = true;

      giscusContainer.appendChild(script);
    }
  </script>

</body>
</html>
